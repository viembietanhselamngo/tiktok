<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mystical Tarot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FontAwesome for celestial symbols -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Quicksand:wght@300;400;600&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #0b0612;
            color: #e2d8f0;
            overflow-x: hidden;
            perspective: 1000px;
        }

        .font-cinzel {
            font-family: 'Cinzel Decorative', serif;
        }

        /* Ambient Glows */
        .gold-glow {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .gold-text-glow {
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
        }

        .purple-glow {
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.35);
        }

        /* Card styles & 3D Flip */
        .card-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .tarot-card {
            width: 140px;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .tarot-card {
                width: 160px;
                height: 280px;
            }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid #d4af37;
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .card-back {
            background: linear-gradient(135deg, #1a0033 0%, #0b0612 50%, #2d0b5a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-front {
            transform: rotateY(180deg);
            background-color: #1a162b;
        }

        .tarot-card.flipped {
            transform: rotateY(180deg);
        }

        .tarot-card.reversed .card-front img {
            transform: rotate(180deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0612;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d0b5a;
            border-radius: 4px;
            border: 1px solid #d4af37;
        }

        /* Celestial Pulse Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 15px #d4af37); }
            50% { opacity: 0.8; filter: drop-shadow(0 0 30px #ffd700); }
        }

        .celestial-sun {
            animation: floatSlow 8s ease-in-out infinite, pulseGlow 4s ease-in-out infinite;
        }

        .celestial-moon {
            animation: floatSlow 10s ease-in-out infinite reverse, pulseGlow 5s ease-in-out infinite 1s;
        }
    </style>
</head>

                        </div>
                    </div>

                    <button id="drawBtn" class="w-full sm:w-auto bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-bold px-8 py-3.5 rounded-xl shadow-lg hover:shadow-amber-500/50 transition-all duration-300 flex items-center justify-center space-x-2 font-cinzel tracking-wider text-sm">

                </div>
            </div>
        </div>

            <!-- Dynamic tarot cards will be rendered here -->

            { name: "Four of Pentacles", nameVi: "Four of Pentacles (4 Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Pents04.jpg", arcana: "Minor" },
            { name: "Five of Pentacles", nameVi: "Five of Pentacles (5 Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/9/96/Pents05.jpg", arcana: "Minor" },
            { name: "Six of Pentacles", nameVi: "Six of Pentacles (6 Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/a/a6/Pents06.jpg", arcana: "Minor" },
            { name: "Seven of Pentacles", nameVi: "Seven of Pentacles (7 Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/6/6a/Pents07.jpg", arcana: "Minor" },
            { name: "Eight of Pentacles", nameVi: "Eight of Pentacles (8 Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/4/49/Pents08.jpg", arcana: "Minor" },
            { name: "Nine of Pentacles", nameVi: "Nine of Pentacles (9 Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/f/f0/Pents09.jpg", arcana: "Minor" },
            { name: "Ten of Pentacles", nameVi: "Ten of Pentacles (10 Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/4/42/Pents10.jpg", arcana: "Minor" },
            { name: "Page of Pentacles", nameVi: "Page of Pentacles (Tiểu Đệ Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/e/ec/Pents11.jpg", arcana: "Minor" },
            { name: "Knight of Pentacles", nameVi: "Knight of Pentacles (Hiệp Sĩ Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/d/d5/Pents12.jpg", arcana: "Minor" },
            { name: "Queen of Pentacles", nameVi: "Queen of Pentacles (Nữ Hoàng Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/8/88/Pents13.jpg", arcana: "Minor" },
            { name: "King of Pentacles", nameVi: "King of Pentacles (Vua Tiền)", img: "https://upload.wikimedia.org/wikipedia/commons/1/1c/Pents14.jpg", arcana: "Minor" }
        ];

        /* -------------------------------------------------------------------------- */
        /* 2. STATE & UI SETUP                                                       */
        /* -------------------------------------------------------------------------- */
        let selectedCount = 3; // Default 3 cards
        let currentDrawnCards = [];

        // Build Card Selector Buttons 1-9
        const cardCountGroup = document.getElementById('cardCountGroup');
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `w-8 h-8 rounded-lg font-cinzel text-xs font-bold transition-all border ${
                i === selectedCount 
                ? 'bg-amber-400 text-slate-950 border-amber-300 shadow-md shadow-amber-500/30 scale-105' 
                : 'bg-slate-900/60 text-amber-200/70 border-amber-500/20 hover:border-amber-400 hover:text-amber-200'
            }`;
            btn.innerText = i;
            btn.onclick = () => {
                selectedCount = i;
                Array.from(cardCountGroup.children).forEach((child, idx) => {
                    const active = (idx + 1) === selectedCount;
                    child.className = `w-8 h-8 rounded-lg font-cinzel text-xs font-bold transition-all border ${
                        active 
                        ? 'bg-amber-400 text-slate-950 border-amber-300 shadow-md shadow-amber-500/30 scale-105' 
                        : 'bg-slate-900/60 text-amber-200/70 border-amber-500/20 hover:border-amber-400 hover:text-amber-200'
                    }`;
                });
            };
            cardCountGroup.appendChild(btn);
        }

        /* -------------------------------------------------------------------------- */
        /* 3. STARRY CANVAS ANIMATION                                                */
        /* -------------------------------------------------------------------------- */
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const numStars = Math.floor((canvas.width * canvas.height) / 3000);
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.8 + 0.2,
                    alpha: Math.random(),
                    speed: Math.random() * 0.015 + 0.005
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(212, 175, 55, ${Math.abs(star.alpha) * 0.7})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();

        /* -------------------------------------------------------------------------- */
        /* 4. 3D MOUSE & GYROSCOPE TILT INTERACTION                                  */
        /* -------------------------------------------------------------------------- */
        const tiltContainer = document.getElementById('tiltContainer');

        // Mouse tilt
        window.addEventListener('mousemove', (e) => {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const dx = (e.clientX - cx) / cx;
            const dy = (e.clientY - cy) / cy;

            const rotX = dy * -8;
            const rotY = dx * 8;

            tiltContainer.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        });

        // Mobile Gyroscope tilt
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta !== null && e.gamma !== null) {
                    const rotX = Math.min(Math.max((e.beta - 45) * 0.2, -10), 10);
                    const rotY = Math.min(Math.max(e.gamma * 0.2, -10), 10);
                    tiltContainer.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
                }
            });
        }

        /* -------------------------------------------------------------------------- */
        /* 5. 3D CIRCULAR VORTEX SHUFFLE & DRAW LOGIC                                */
        /* -------------------------------------------------------------------------- */
        const cardsLayout = document.getElementById('cardsLayout');
        const drawBtn = document.getElementById('drawBtn');

        drawBtn.addEventListener('click', startShuffleAndDraw);

        function startShuffleAndDraw() {
            const question = document.getElementById('questionInput').value.trim();
            
            // Hide reading section during new draw
            document.getElementById('readingSection').classList.add('hidden');
            cardsLayout.innerHTML = '';

            // Pick N unique cards randomly from the 78 deck
            const shuffledDeck = [...TAROT_DECK].sort(() => Math.random() - 0.5);
            currentDrawnCards = shuffledDeck.slice(0, selectedCount).map(card => ({
                ...card,
                isReversed: Math.random() < 0.4 // 40% chance of Reversed
            }));

            // Create Card elements for Vortex animation
            const cardElements = [];
            currentDrawnCards.forEach((cardData, idx) => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = 'card-container transition-all duration-700';

                const card = document.createElement('div');
                card.className = `tarot-card ${cardData.isReversed ? 'reversed' : ''}`;
                card.dataset.index = idx;

                card.innerHTML = `
                    <div class="card-face card-back">
                        <div class="w-full h-full p-2 flex flex-col justify-between items-center border border-amber-500/30 rounded-lg">
                            <i data-lucide="sun" class="w-5 h-5 text-amber-400/50"></i>
                            <div class="w-10 h-10 rounded-full border border-amber-400/40 flex items-center justify-center">
                                <i data-lucide="sparkles" class="w-5 h-5 text-amber-300/70"></i>
                            </div>
                            <i data-lucide="moon" class="w-5 h-5 text-amber-400/50"></i>
                        </div>
                    </div>
                    <div class="card-face card-front">
                        <img src="${cardData.img}" alt="${cardData.name}" class="w-full h-full object-cover rounded-lg" onerror="this.src='https://placehold.co/160x280/1a0033/d4af37?text=Tarot+Card'">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-2 text-center">
                            <span class="block text-[11px] font-cinzel text-amber-300 font-bold leading-tight">${cardData.nameVi}</span>
                            <span class="block text-[9px] text-amber-400/80 uppercase tracking-widest mt-0.5">${cardData.isReversed ? 'Ngược ↺' : 'Xuôi ➔'}</span>
                        </div>
                    </div>
                `;

                cardWrapper.appendChild(card);
                cardsLayout.appendChild(cardWrapper);
                cardElements.push(cardWrapper);
            });

            lucide.createIcons();

            // Run 3D Flying Circular Vortex Animation
            animateVortex(cardElements, () => {
                // Reveal & Flip Cards sequentially
                cardElements.forEach((wrapper, index) => {
                    setTimeout(() => {
                        const card = wrapper.querySelector('.tarot-card');
                        card.classList.add('flipped');
                    }, index * 250);
                });

                // Request Gemini Interpretation after flip completes
                setTimeout(() => {
                    fetchGeminiInterpretation(question, currentDrawnCards);
                }, cardElements.length * 250 + 400);
            });
        }

        /* 3D Circular Floating Vortex Animation */
        function animateVortex(elements, onComplete) {
            const startTime = performance.now();
            const duration = 2200; // 2.2s vortex shuffle

            function step(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                elements.forEach((el, i) => {
                    // Spiral vortex mathematics
                    const angle = (progress * Math.PI * 6) + (i * (Math.PI * 2 / elements.length));
                    const radius = (1 - Math.pow(progress - 0.5, 2) * 4) * 160 + 40; 
                    const flyY = Math.sin(progress * Math.PI) * -120;
                    const rotateZ = angle * (180 / Math.PI);
                    const rotateX = Math.sin(angle) * 35;

                    if (progress < 1) {
                        el.style.transform = `translate3d(${Math.cos(angle) * radius}px, ${Math.sin(angle) * radius + flyY}px, ${Math.sin(angle) * 100}px) rotateZ(${rotateZ}deg) rotateX(${rotateX}deg) scale(${0.8 + Math.sin(progress * Math.PI) * 0.3})`;
                    } else {
                        // Smoothly reset back to deal layout position
                        el.style.transform = 'translate3d(0, 0, 0) rotateZ(0deg) rotateX(0deg) scale(1)';
                    }
                });

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    if (onComplete) onComplete();
                }
            }

            requestAnimationFrame(step);
        }

        /* -------------------------------------------------------------------------- */
        /* 6. GEMINI API INTEGRATION FOR TAROT READING                               */
        /* -------------------------------------------------------------------------- */
        async function fetchGeminiInterpretation(question, cards) {
            const readingSection = document.getElementById('readingSection');
            const loadingState = document.getElementById('loadingState');
            const readingContent = document.getElementById('readingContent');
            const readingQuestionTag = document.getElementById('readingQuestionTag');

            readingSection.classList.remove('hidden');
            loadingState.classList.remove('hidden');
            readingContent.innerHTML = '';
            readingQuestionTag.innerText = question ? `"${question}"` : 'Thông điệp tổng quan từ các lá bài';

            // Construct card description strings
            const cardsDescription = cards.map((c, i) => 
                `Lá ${i+1}: ${c.nameVi} (${c.name}) - Trạng thái: ${c.isReversed ? 'NGƯỢC (Reversed)' : 'XUÔI (Upright)'}`
            ).join('\n');

            const systemPrompt = `Bạn là một Reader Tarot chuyên nghiệp, sâu sắc, huyền bí và mang năng lượng chữa lành. 
Hãy giải bài Tarot dựa trên các lá bài được bốc và câu hỏi của người dùng.
Yêu cầu trình bày:
- Viết bằng tiếng Việt tinh tế, mang không khí huyền ảo, ấm áp.
- Phân tích chi tiết ý nghĩa từng lá bài trong ngữ cảnh câu hỏi.
- Tổng kết thông điệp chính và đưa ra lời khuyên chân thành từ vũ trụ.
- Sử dụng định dạng HTML với các thẻ <h3>, <p>, <ul>, <li>, <strong> để trình bày đẹp mắt. Không dùng markdown backticks (\`\`\`).`;

            const userPrompt = `Câu hỏi của tôi: "${question || 'Hãy cho tôi thông điệp tổng quan về cuộc sống hiện tại'}"
Danh sách lá bài đã bốc được (${cards.length} lá):
${cardsDescription}`;

            const apiKey = ""; // Canvas runtime automatically handles this
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            // Fetch with Exponential Backoff retry strategy
            let response = null;
            let retries = 0;
            const maxRetries = 3;
            let delay = 1000;

            while (retries < maxRetries) {
                try {
                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        response = await res.json();
                        break;
                    }
                } catch (err) {
                    console.error("Gemini API attempt error:", err);
                }
                retries++;
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }

            loadingState.classList.add('hidden');

            if (response && response.candidates && response.candidates[0]?.content?.parts[0]?.text) {
                let htmlText = response.candidates[0].content.parts[0].text;
                // Clean markdown codeblocks if model returned any
                htmlText = htmlText.replace(/```html/g, '').replace(/```/g, '').trim();
                readingContent.innerHTML = htmlText;
            } else {
                // Fallback Interpretation if API unavailable
                readingContent.innerHTML = `
                    <div class="p-4 rounded-xl border border-amber-500/30 bg-amber-500/5">
                        <h3 class="text-amber-300 font-cinzel text-base font-bold mb-2">Thông Điệp Vũ Trụ (Offline Mode)</h3>
                        <p>Vũ trụ đã gửi gắm năng lượng qua <strong>${cards.length} lá bài</strong> bạn vừa chọn:</p>
                        <ul class="list-disc list-inside space-y-1 my-3 text-amber-200/90">
                            ${cards.map(c => `<li><strong>${c.nameVi}</strong> (${c.isReversed ? 'Ngược' : 'Xuôi'})</li>`).join('')}
                        </ul>
                        <p>Các lá bài phản ánh một giai đoạn biến chuyển mạnh mẽ. Trạng thái xuôi mang lại năng lượng chủ động, trong khi trạng thái ngược nhắc nhở bạn quan sát kỹ lưỡng thế giới nội tâm trước khi đưa ra quyết định quan trọng.</p>
                    </div>
                `;
            }
        }
    </script>
